<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee & R&B | Nov 28</title>
<meta property="og:title" content="Coffee & R&B — Sat, Nov 28">
<meta property="og:description" content="Good coffee, smooth R&B, good people. Get your tickets.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#1a0f0a;--bg2:#3b2216;--bg3:#5c3a24;--cream:#f5e6d3;--gold:#d4a24c;--muted:#b9a08a;--card:#24140d;--line:#6b4530}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--cream);min-height:100vh;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%) fixed}
  .wrap{max-width:560px;margin:0 auto;padding:24px 20px 150px}
  .brand{font-weight:800;letter-spacing:.08em;color:var(--gold);font-size:14px;text-decoration:none}
  .flyer{margin:24px 0;border-radius:16px;overflow:hidden;aspect-ratio:1/1;
    background:radial-gradient(circle at 30% 20%,#7a4a2b,#2a160c 70%);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;border:1px solid var(--line)}
  .flyer img{width:100%;height:100%;object-fit:cover}
  .flyer .date{font-weight:800;font-size:22px;color:var(--gold)}
  .flyer h2{font-family:'Playfair Display',serif;font-size:56px;line-height:1;margin:12px 0}
  .flyer h2 i{color:var(--gold)}
  .flyer .tag{letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:var(--muted)}
  h1{font-size:34px;font-weight:600;margin-bottom:8px}
  .meta{font-size:18px;line-height:1.6}
  .loc{display:flex;gap:10px;margin-top:16px;align-items:flex-start}
  .loc a{color:var(--cream);font-size:17px;line-height:1.5}
  hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  h3{font-size:28px;margin-bottom:12px}
  .about p{font-size:17px;line-height:1.6;margin-bottom:10px}
  .ticket{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:16px}
  .ticket .name{font-weight:600;font-size:18px}
  .ticket .price{font-size:36px;font-weight:800;margin:6px 0 2px}
  .ticket .price s{font-size:22px;color:var(--muted);font-weight:600;margin-left:8px}
  .ticket .fees{color:var(--muted);font-size:14px}
  .ticket .note{margin-top:10px;font-size:15px}
  .row{display:flex;justify-content:flex-end;margin-top:16px}
  .qty{display:flex;align-items:center;gap:24px;border:2px solid var(--cream);border-radius:999px;padding:8px 22px}
  .qty button{background:none;border:0;color:var(--cream);font-size:24px;cursor:pointer;width:24px}
  .qty span{font-size:20px;min-width:20px;text-align:center}
  .coupon{margin-top:24px}
  .coupon label{font-size:14px;color:var(--muted);display:block;margin-bottom:8px}
  .code{display:flex;gap:10px}
  .code input{flex:1;min-width:0;background:transparent;border:2px solid var(--line);border-radius:999px;
    color:var(--cream);padding:12px 18px;font:inherit;font-size:16px;text-transform:uppercase}
  .code input:focus{outline:none;border-color:var(--gold)}
  .code button{background:transparent;border:2px solid var(--gold);color:var(--gold);border-radius:999px;
    padding:0 20px;font-weight:700;font-size:15px;cursor:pointer}
  .msg{font-size:14px;margin-top:8px;min-height:18px}
  .msg.err{color:#e88b7a} .msg.ok{color:#9fd39a}
  .msg button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;margin-left:8px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:16px 20px;background:rgba(26,15,10,.92);
    backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .bar .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .total{font-size:15px;color:var(--muted)} .total b{display:block;color:var(--cream);font-size:22px}
  .total small{display:block;color:#9fd39a;font-size:13px}
  .buy{background:var(--gold);color:#1a0f0a;border:0;border-radius:999px;padding:14px 28px;font-weight:800;font-size:16px;cursor:pointer}
  .buy:disabled{opacity:.4;cursor:not-allowed}
  .badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">COFFEE &amp; R&amp;B</a>
  <div class="flyer" id="flyer">
    <div class="date">NOV. 28TH</div>
    <h2>Coffee <i>&amp;</i> R&amp;B</h2>
    <div class="tag">Good coffee · Good vibes · Good people</div>
  </div>
  <h1 id="title"></h1>
  <div class="meta"><div id="host"></div><div id="when"></div></div>
  <div class="loc">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <a id="venue" target="_blank" rel="noopener"></a>
  </div>
  <span class="badge" id="age"></span>
  <hr>
  <section class="about"><h3>About</h3><div id="about"></div></section>
  <hr>
  <div class="ticket">
    <div class="name" id="tName"></div>
    <div class="price" id="tPrice"></div>
    <div class="fees" id="tFees"></div>
    <div class="note" id="tNote"></div>
    <div class="row">
      <div class="qty">
        <button id="minus" aria-label="Remove ticket">−</button>
        <span id="count">0</span>
        <button id="plus" aria-label="Add ticket">+</button>
      </div>
    </div>
  </div>
  <div class="coupon">
    <label for="couponInput">Have a coupon code?</label>
    <div class="code">
      <input id="couponInput" placeholder="Enter code" autocomplete="off">
      <button id="applyBtn">Apply</button>
    </div>
    <div class="msg" id="couponMsg"></div>
  </div>
</div>
<div class="bar">
  <div class="inner">
    <div class="total">Total<b id="total">$0.00</b><small id="saved"></small></div>
    <button class="buy" id="buy" disabled>Get Tickets</button>
  </div>
</div>
<script>
/* ===== EDIT YOUR EVENT DETAILS HERE ===== */
const EVENT = {
  title: "Coffee & R&B",
  host: "Hosted by joingemm",
  when: "Sat, Nov 28 at 12:00 PM - 4:00 PM",
  venue: "Venue Name, 123 Main St, St. Louis, MO 63101",
  ageLimit: "21+ ONLY",
  flyerImage: "",
  about: [
    "COFFEE. R&B. GOOD ENERGY. ☕🎶",
    "Join us Saturday, November 28th for an afternoon of specialty coffee, smooth R&B, and great company.",
    "Live DJ sets all day from DJ Name, DJ Name & DJ Name.",
    "Vendors and specials dropping soon. 👀"
  ],
  ticket: { name: "GA", price: 11.00, fee: 3.75, note: "Early bird pricing until Nov 20th", maxPerOrder: 10 },
  coupons: {
    "GEMM":       { type: "amount",  value: 3 },
    "COFFEELOVE": { type: "percent", value: 20 }
  },
  checkoutUrl: "https://buy.stripe.com/YOUR_GA_LINK"
};
/* ======================================== */
const $ = id => document.getElementById(id);
const money = n => "$" + n.toFixed(2);
const T = EVENT.ticket;
$("title").textContent = EVENT.title;
$("host").textContent = EVENT.host;
$("when").textContent = EVENT.when;
$("venue").textContent = EVENT.venue;
$("venue").href = "https://maps.google.com/?q=" + encodeURIComponent(EVENT.venue);
EVENT.ageLimit ? $("age").textContent = EVENT.ageLimit : $("age").remove();
$("about").innerHTML = EVENT.about.map(p => `<p>${p}</p>`).join("");
if (EVENT.flyerImage) $("flyer").innerHTML = `<img src="${EVENT.flyerImage}" alt="${EVENT.title} flyer">`;
$("tName").textContent = T.name;
$("tFees").textContent = "+ " + money(T.fee) + " fee";
$("tNote").textContent = T.note;
let qty = 0, coupon = null;
function ticketPrice(){
  if (coupon === null) return T.price;
  const c = EVENT.coupons[coupon];
  const off = c.type === "percent" ? T.price * c.value / 100 : c.value;
  return Math.max(T.price - off, 0);
}
function render(){
  const p = ticketPrice();
  $("tPrice").innerHTML = coupon ? `${money(p)}<s>${money(T.price)}</s>` : money(T.price);
  $("count").textContent = qty;
  $("total").textContent = money(qty * (p + T.fee));
  $("saved").textContent = coupon && qty ? `You save ${money(qty * (T.price - p))}` : "";
  $("buy").disabled = qty === 0;
}
$("plus").onclick = () => { if (qty < T.maxPerOrder) qty++; render(); };
$("minus").onclick = () => { if (qty > 0) qty--; render(); };
function applyCoupon(){
  const val = $("couponInput").value.trim().toUpperCase();
  const msg = $("couponMsg");
  if (val === "") return;
  if (EVENT.coupons[val]) {
    coupon = val;
    const c = EVENT.coupons[val];
    msg.className = "msg ok";
    msg.innerHTML = `Code ${val} applied — ${c.type === "percent" ? c.value + "%" : money(c.value)} off each ticket ✓ <button id="removeCoupon">Remove</button>`;
    $("removeCoupon").onclick = () => { coupon = null; msg.textContent = ""; $("couponInput").value = ""; render(); };
  } else {
    coupon = null;
    msg.className = "msg err";
    msg.textContent = "That code isn't valid.";
  }
  render();
}
$("applyBtn").onclick = applyCoupon;
$("couponInput").addEventListener("keydown", e => { if (e.key === "Enter") applyCoupon(); });
$("buy").onclick = () => {
  let url = EVENT.checkoutUrl;
  if (coupon) url += (url.includes("?") ? "&" : "?") + "prefilled_promo_code=" + encodeURIComponent(coupon);
  (window.top || window).location.href = url;
};
render();
</script>
</body>
</html>
